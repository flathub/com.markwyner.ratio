app-id: com.markwyner.ratio
runtime: org.gnome.Platform
runtime-version: '51' # make sure gnome runtime version is current when I build
sdk: org.gnome.Sdk
command: ratio

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: ratio
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://codeberg.org/markwyner/ratio-for-linux.git
        commit: 47137fdf0ce990b2e641e09aa27a5a35ba0e323f
