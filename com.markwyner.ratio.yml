app-id: com.markwyner.ratio
runtime: org.gnome.Platform
runtime-version: '51' # make sure gnome runtime version is current when I build
sdk: org.gnome.Sdk
command: ratio

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: ratio
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://codeberg.org/markwyner/ratio-for-linux.git
        tag: v1.0.4
        commit: 0f14a4732be6623c835d7c7952406b949549abf1
