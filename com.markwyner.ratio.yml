app-id: com.markwyner.ratio
runtime: org.gnome.Platform
runtime-version: '51' # make sure gnome runtime version is current when I build
sdk: org.gnome.Sdk
command: ratio

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: ratio
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://codeberg.org/markwyner/ratio-for-linux.git
        commit: 4040b1323fc1e9d1bb4c0e59356976cea372d23c
